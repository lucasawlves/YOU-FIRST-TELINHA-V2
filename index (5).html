<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compartilhar Tela</title>
<style>
  :root{--bg:#1e1f22;--card:#2b2d31;--txt:#f2f3f5;--mut:#b5bac1;--acc:#5865f2;--red:#da373c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px;gap:12px;min-height:100vh}
  button{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:12px 18px;font-size:15px;cursor:pointer}
  button.red{background:var(--red)}
  .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  #link{width:min(600px,100%);background:var(--card);color:var(--txt);border:0;border-radius:6px;padding:10px;font-size:14px}
  video{position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;background:#000;z-index:0}
  body>*:not(video):not(script){position:relative;z-index:1;transition:opacity .3s}
  body.idle>*:not(video):not(script){opacity:0;pointer-events:none}
  body.idle{cursor:none}
  video:fullscreen{max-height:none;width:100vw;height:100vh;object-fit:contain;border-radius:0;cursor:none}
  #st{color:var(--mut);font-size:14px}
  .hide{display:none!important}

  #intro{position:fixed;inset:0;z-index:9999;background:#D73526;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity .6s}
  #intro.out{opacity:0;pointer-events:none}
  #introGrid{position:absolute;inset:-100px;
    background-image:linear-gradient(rgba(255,255,255,.75) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.75) 1px,transparent 1px);
    background-size:90px 90px;background-position:center;
    -webkit-mask-image:radial-gradient(ellipse 60% 55% at 50% 50%,#000 20%,transparent 100%);
    mask-image:radial-gradient(ellipse 60% 55% at 50% 50%,#000 20%,transparent 100%);
    animation:gridMove 4s linear infinite,gridPulse 2.5s ease-in-out infinite}
  @keyframes gridMove{from{background-position:0 0}to{background-position:90px 90px}}
  @keyframes gridPulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}
  #introBox{position:relative;width:min(70vmin,520px)}
  #introTxt{position:absolute;left:0;top:100%;margin-top:15px;width:100%;height:auto;display:block;image-rendering:pixelated;opacity:0;transform:scale(.85)}
  #introTxt.show{opacity:1;transform:scale(1);transition:opacity .5s .15s,transform .5s .15s cubic-bezier(.2,.9,.3,1.2)}
  #introImg{position:relative;width:100%;height:auto;border-radius:76px;display:block;opacity:0;transform:scale(.85)}
  #introImg.show{opacity:1;transform:scale(1);transition:opacity .5s,transform .5s cubic-bezier(.2,.9,.3,1.2)}
</style>
</head>

<div id="host" class="row">
  <select id="q" style="background:var(--card);color:var(--txt);border:0;border-radius:6px;padding:12px">
    <option value="720,30,2500">720p 30fps</option>
    <option value="1080,30,5000" selected>1080p 30fps</option>
    <option value="1080,60,8000">1080p 60fps</option>
    <option value="1440,60,12000">1440p 60fps</option>
    <option value="0,60,16000">Original 60fps</option>
  </select>
  <button id="tab">Compartilhar aba (só áudio da aba)</button>
  <button id="screen">Compartilhar tela/janela</button>
  <button id="stop" class="red hide">Parar</button>
</div>
<div id="share" class="row hide">
  <input id="link" readonly>
  <button id="copy">Copiar link</button>
</div>
<div id="st"></div>
<button id="play" class="hide">▶ Clique para assistir com som</button>
<video id="v" autoplay playsinline muted title="Clique duas vezes para tela cheia"></video>
<div class="row"><button id="fs">⛶ Tela cheia</button><button id="fit">Modo: Ajustar</button>
  <label id="volw" style="display:flex;align-items:center;gap:6px;background:var(--card);border-radius:6px;padding:0 12px">
    <span id="mute" style="cursor:pointer">🔊</span><input id="vol" type="range" min="0" max="1" step="0.01" value="1">
  </label></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const st = t => $('st').textContent = t;
const v = $('v');
const fs = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
const modes = [['contain','Ajustar'],['cover','Preencher'],['fill','Esticar']];
let mi = 0;
const updIcon = () => $('mute').textContent = (v.muted || v.volume == 0) ? '🔇' : '🔊';
$('vol').oninput = e => { v.volume = +e.target.value; if (hostId) v.muted = v.volume == 0; updIcon(); };
$('mute').onclick = () => { if (hostId) { v.muted = !v.muted; $('play').classList.add('hide'); } updIcon(); };
v.onvolumechange = updIcon;
$('fit').onclick = () => { mi = (mi + 1) % 3; v.style.objectFit = modes[mi][0]; $('fit').textContent = 'Modo: ' + modes[mi][1]; };
$('fs').onclick = fs; v.ondblclick = fs;
let idleT;
const wake = () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 5000); };
['mousemove','mousedown','touchstart','keydown'].forEach(e => document.addEventListener(e, wake));
wake();
const hostId = new URLSearchParams(location.search).get('v');

if (hostId) {
  // ===== ESPECTADOR =====
  $('host').classList.add('hide');
  st('Conectando...');
  const peer = new Peer();
  peer.on('open', () => {
    const conn = peer.connect(hostId);
    conn.on('open', () => st('Aguardando transmissão...'));
    conn.on('close', () => st('Transmissão encerrada.'));
  });
  peer.on('call', call => {
    call.answer();
    call.on('stream', s => {
      v.srcObject = s; v.muted = false; st('Ao vivo');
      v.play().catch(() => { v.muted = true; v.play(); $('play').classList.remove('hide'); });
    });
    call.on('close', () => st('Transmissão encerrada.'));
  });
  peer.on('error', e => st('Erro: ' + e.type));
  $('play').onclick = () => { v.muted = false; v.play(); $('play').classList.add('hide'); };
} else {
  // ===== QUEM COMPARTILHA =====
  $('volw').classList.add('hide');
  let stream = null, calls = [], peer = null;
  const viewers = new Set();

  function callViewer(id) {
    if (!stream) return;
    const call = peer.call(id, stream);
    calls.push(call);
    const pc = call.peerConnection;
    const setBitrate = () => pc.getSenders().forEach(s => {
      if (s.track && s.track.kind === 'video') {
        const p = s.getParameters();
        if (!p.encodings || !p.encodings.length) p.encodings = [{}];
        p.encodings[0].maxBitrate = bitrate * 1000;
        p.degradationPreference = 'maintain-resolution';
        s.setParameters(p).catch(() => {});
      }
    });
    pc.addEventListener('connectionstatechange', () => { if (pc.connectionState === 'connected') setBitrate(); });
  }
  let bitrate = 5000;

  async function start(tabOnly) {
    try {
      stop();
      const [h, fps, br] = $('q').value.split(',').map(Number);
      bitrate = br;
      const vid = { frameRate: { ideal: fps, max: fps } };
      if (h) vid.height = { ideal: h, max: h };
      stream = await navigator.mediaDevices.getDisplayMedia(tabOnly ? {
        video: { ...vid, displaySurface: 'browser' },
        audio: { suppressLocalAudioPlayback: false, echoCancellation: false, noiseSuppression: false, autoGainControl: false },
        preferCurrentTab: false, selfBrowserSurface: 'exclude', systemAudio: 'exclude', surfaceSwitching: 'include'
      } : {
        video: vid, audio: false
      });
      stream.getVideoTracks()[0].contentHint = fps >= 60 ? 'motion' : 'detail';
    } catch (e) { st('Cancelado.'); return; }

    v.srcObject = stream; v.muted = true;
    stream.getVideoTracks()[0].onended = stop;
    $('stop').classList.remove('hide');
    if (tabOnly && !stream.getAudioTracks().length) st('Aviso: sem áudio — marque "Compartilhar áudio da aba".');

    if (!peer) {
      peer = new Peer();
      peer.on('open', id => {
        $('link').value = location.origin + location.pathname + '?v=' + id;
        $('share').classList.remove('hide');
        if (!$('st').textContent.startsWith('Aviso')) st('Envie o link. Espectadores: 0');
      });
      peer.on('connection', c => {
        viewers.add(c.peer); callViewer(c.peer);
        st('Espectadores: ' + viewers.size);
        c.on('close', () => { viewers.delete(c.peer); st('Espectadores: ' + viewers.size); });
      });
      peer.on('error', e => st('Erro: ' + e.type));
    } else {
      viewers.forEach(callViewer);
      st('Espectadores: ' + viewers.size);
    }
  }

  function stop() {
    calls.forEach(c => c.close()); calls = [];
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null; v.srcObject = null;
    $('stop').classList.add('hide');
  }

  $('tab').onclick = () => start(true);
  $('screen').onclick = () => start(false);
  $('stop').onclick = () => { stop(); st('Parado. O link continua valendo.'); };
  $('copy').onclick = () => { navigator.clipboard.writeText($('link').value); $('copy').textContent = 'Copiado!'; };
}

// ===== INTRO =====
(() => {
  const intro = document.getElementById('intro'), img = document.getElementById('introImg'), snd = document.getElementById('introSnd');
  const IMG_TIME = 5000; // tempo da intro na tela e da música (ms)
  let ended = false;
  const startSnd = () => {
    if (ended || !snd.paused) return;
    snd.play().then(() => ['pointerdown','keydown','touchstart'].forEach(e => document.removeEventListener(e, startSnd))).catch(() => {});
  };
  startSnd();
  ['pointerdown','keydown','touchstart'].forEach(e => document.addEventListener(e, startSnd));
  requestAnimationFrame(() => requestAnimationFrame(() => { img.classList.add('show'); document.getElementById('introTxt').classList.add('show'); }));
  setTimeout(() => {
    ended = true; snd.pause();
    intro.classList.add('out'); setTimeout(() => intro.remove(), 700);
  }, IMG_TIME);
})();
</script>
</body>
